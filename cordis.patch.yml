# ============================================================================
# dsh-all-rewind —— DSH bundle patch
# ============================================================================
# 把一个 host 插件插入 desktop/web profile 的配置树。
#   - 宿主半区：lib/index.js —— 每个工作区一个影子 git 仓库、轮次钩子、工具与 HTTP API
#   - 客户端半区：assets/ui.js —— 经 webServer 的 index 注入，每条用户提示词下方的回退按钮
#
# 本地开发安装：
#   dsh plugin --profile desktop add link:<本目录绝对路径>
# 或使用本包的 install.mjs（会复制到 profile node_modules 并写入 cordis.patch.yml）。
#
# 运行依赖 / 权限：
#   - DSH 进程需要能找到 Git 2.13+（PATH 或下面配置 gitExecutable）
#   - 会话权限预设需允许写工作区（只读会话会被 READ_ONLY_SESSION 拒绝）
#   - dataDir（默认 $DSH_HOME/dsh-all-rewind）需要当前用户可写，无需管理员权限
# ============================================================================

- insert:
    - id: dsh-all-rewind
      name: dsh-all-rewind
      config:
        # 影子 git 仓库根目录（默认 $DSH_HOME/dsh-all-rewind；支持绝对路径、~/、相对 DSH_HOME）
        # dataDir: D:/dsh-rewind-repo
        # git 不在 PATH 时指定可执行文件（Windows 示例）
        # gitExecutable: "C:/Program Files/Git/cmd/git.exe"
        keepTurns: 20
        conversation:
          enabled: true
        autoMaintenance:
          enabled: true
          thresholdBytes: 536870912
          checkEveryTurns: 5
        # 追加到影子仓库 exclude 文件的 gitignore 风格规则
        # exclude:
        #   - "*.dsh-snap"
